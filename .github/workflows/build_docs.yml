---
name: Build Docs
# Read-only by default: pull requests build the docs but must not be able to
# write to the repository. Only the publish job, which runs on pushes to main
# and on tags, is granted write access.
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
        - "v*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: Manual Doc Build
        default: run-doc-build
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: docs/docs_env.yml
          micromamba-version: "latest"

      - name: Install package
        run: pip install . --no-deps

      - name: Make docs
        run: cd docs; make html

      - name: Upload built docs
        uses: actions/upload-artifact@v7
        with:
          name: docs_html
          path: docs/build/html

  publish:
    name: Publish docs
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download built docs
        uses: actions/download-artifact@v7
        with:
          name: docs_html
          path: docs/build/html

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Publish to Github Pages on main (dev)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html/
          destination_dir: dev
          keep_files: false

      - name: Publish to Github Pages on release (versioned)
        if: ${{ github.ref_type == 'tag' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html/
          destination_dir: ${{ github.ref_name }}

      - name: Publish to Github Pages on release (stable)
        if: ${{ github.ref_type == 'tag' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html/
          destination_dir: stable
          keep_files: false

      - name: Update the versions switcher
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git checkout gh-pages
          git fetch
          git pull
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python update_version_json.py --version ${{ github.ref_name }}
          git add versions.json
          git commit -m "Update versions switcher"
          git push
          git checkout main
