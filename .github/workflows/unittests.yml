---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "59 23 * * *"
  workflow_dispatch:
   inputs:
     version:
       description: Manual CI Run
       default: test
       required: false

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: lint and format check
        run: |
          # Pinned: a new ruff release can change formatting rules, and CI
          # should only go red for changes made in this repository.
          python -m pip install ruff==0.16.9
          ruff check .
          ruff format --check .

  tests:
    name: ${{ matrix.os }}, ${{ matrix.environment-file }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        environment-file: [
           ci/310.yml,
           ci/311.yml,
           ci/312.yml,
           ci/313.yml,
           ci/314.yml,
           ci/minimal.yml,
        ]
        include:
          - environment-file: ci/314.yml
            os: macos-15-intel # Intel
          - environment-file: ci/314.yml
            os: macos-latest # Apple Silicon
          - environment-file: ci/314.yml
            os: windows-latest
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ matrix.environment-file }}
          micromamba-version: "latest"

      - name: environment info
        run: |
          micromamba info
          micromamba list

      - name: install package
        run: "pip install -e . --no-deps"

      # The whole package, not just bayesplain/tests: pyproject's
      # --doctest-modules then runs every docstring example too, so the
      # numbers printed in the documentation are assertions.
      - name: run tests
        run: |
          pytest bayesplain \
          -v \
          -r a \
          -n auto \
          --color yes \
          --cov bayesplain \
          --cov-append \
          --cov-report term-missing \
          --cov-report xml .

      - name: codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
