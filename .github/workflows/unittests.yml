---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "59 23 * * *"
  workflow_dispatch:
   inputs:
     version:
       description: Manual CI Run
       default: test
       required: false

jobs:
  tests:
    name: ${{ matrix.os }}, ${{ matrix.environment-file }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        environment-file: [
           ci/312.yml,
           ci/313.yml,
           ci/314.yml,
        ]
        include:
          - environment-file: ci/314.yml
            os: macos-15-intel # Intel
          - environment-file: ci/314.yml
            os: macos-latest # Apple Silicon
          - environment-file: ci/314.yml
            os: windows-latest
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ matrix.environment-file }}
          micromamba-version: "latest"

      - name: environment info
        run: |
          micromamba info
          micromamba list

      - name: install package
        run: "pip install -e . --no-deps"

      - name: run tests
        run: |
          pytest bayesplain/tests \
          -v \
          -r a \
          -n auto \
          --color yes \
          --cov bayesplain \
          --cov-append \
          --cov-report term-missing \
          --cov-report xml .

      - name: codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
